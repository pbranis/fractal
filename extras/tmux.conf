# ~/.tmux.conf - minimalni, bez prebindovani prefixu (zustava Ctrl-b)
set -g mouse on                 # kolecko = scroll, klik = vyber okna/panelu
set -g history-limit 50000      # delsi scrollback pro logy sluzeb
set -g base-index 1             # okna cislovana od 1
setw -g pane-base-index 1
set -g renumber-windows on      # po zavreni okna se cisla srovnaji
set -sg escape-time 10          # at Esc neblbne ve vim/TUI
set -g display-time 2000
set -g focus-events on
set -g default-terminal "tmux-256color"

# rozdeleni panelu podle smeru, dedi aktualni adresar
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# prepinani panelu bez prefixu
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# status: vlevo session, vpravo host a cas
set -g status-interval 5
set -g status-style "bg=colour236,fg=colour250"
set -g status-left  " #[bold]#S#[nobold] "
set -g status-left-length 24
set -g status-right " #H  %H:%M "
setw -g window-status-current-style "bg=colour24,fg=colour255,bold"
setw -g window-status-format  " #I:#W "
setw -g window-status-current-format " #I:#W "

# Kopirovani v tmuxu posle text pres OSC 52 do schranky terminalu, ze ktereho
# jsi pripojeny (vychozi "external" ho jen propousti z aplikaci, sam nic
# neposila - vyber mysi by pak zustal jen v tmux bufferu).
set -g set-clipboard on
