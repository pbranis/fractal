# Shared proxy settings for ttyd (terminal over websocket).
proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection "upgrade";
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
# a terminal keeps its websocket open for hours; the default 60 s would cut it
proxy_read_timeout 86400s;
proxy_send_timeout 86400s;
proxy_buffering off;

# Inject the on-screen key bar (arrows, Esc, Ctrl... for iOS) into the ttyd
# page. The script lives in the web root as /termkeys.js, owned by the user.
# Accept-Encoding is dropped so sub_filter sees uncompressed HTML; gzip
# towards the client is nginx's business.
proxy_set_header Accept-Encoding "";
sub_filter '</body>' '<script src="/termkeys.js"></script></body>';
sub_filter_once on;
